name: Publish FlamingoDB release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: sudo apt-get update -qq && sudo apt-get install -y nsis
      - run: ./packaging/windows/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build/FlamingoDB-Setup-*-x64.exe
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: build
      - name: Publish tagged release with binaries and guide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "FlamingoDB $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md \
            "build/FlamingoDB-Setup-${GITHUB_REF_NAME#v}-x64.exe" \
            docs/FlamingoDB-Technical-Guide.pdf
