name: Publish verified v1.3.1 artifacts
on:
  push:
    branches: [publish-v1.3.1]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.3.1 --verify-tag --title "FlamingoDB v1.3.1" \
            --notes-file RELEASE_NOTES.md release-assets/FlamingoDB-Setup-1.3.1-x64.exe \
            docs/FlamingoDB-Technical-Guide.pdf
