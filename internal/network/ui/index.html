<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlamingoDB Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/framer-motion@10.16.4/dist/framer-motion.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.12.0/sql-wasm.js"></script>

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #080d1a;
      --surface: #0f1829;
      --card: #131e2e;
      --card2: #172236;
      --border: #1e2d45;
      --border2: #263654;
      --text: #e2e8f0;
      --muted: #64748b;
      --muted2: #94a3b8;
      --pink: #f43f87;
      --pink2: #fb7bb2;
      --blue: #3b82f6;
      --blue2: #60a5fa;
      --green: #10b981;
      --green2: #34d399;
      --purple: #8b5cf6;
      --purple2: #a78bfa;
      --gold: #f59e0b;
      --gold2: #fbbf24;
      --red: #ef4444;
      --red2: #f87171;
    }

    html,
    body,
    #root {
      height: 100%;
      width: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border2);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--muted);
    }

    .app-shell {
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: relative;
    }

    .app-shell::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 10% -10%, rgba(244, 63, 135, .12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 90% 110%, rgba(59, 130, 246, .10) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .sidebar {
      width: 240px;
      min-width: 240px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 10;
      position: relative;
    }

    .sidebar-logo {
      padding: 24px 20px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-logo .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 20px rgba(244, 63, 135, .35);
    }

    .sidebar-logo .logo-icon svg {
      width: 20px;
      height: 20px;
      stroke: #fff;
    }

    .sidebar-logo .logo-text {
      font-size: 17px;
      font-weight: 700;
      background: linear-gradient(90deg, var(--pink), var(--purple2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -.3px;
    }

    .sidebar-nav {
      flex: 1;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow-y: auto;
    }

    .nav-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.2px;
      color: var(--muted);
      text-transform: uppercase;
      padding: 8px 8px 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: var(--muted2);
      transition: all .18s ease;
      position: relative;
      user-select: none;
      border: 1px solid transparent;
    }

    .nav-item svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, .04);
      color: var(--text);
    }

    .nav-item.active {
      background: rgba(244, 63, 135, .1);
      color: var(--pink);
      border-color: rgba(244, 63, 135, .2);
    }

    .nav-item.active svg {
      stroke: var(--pink);
    }

    .nav-item .nav-dot {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--pink);
      box-shadow: 0 0 6px var(--pink);
    }

    .sidebar-footer {
      padding: 16px;
      border-top: 1px solid var(--border);
    }

    .conn-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, .08);
      border: 1px solid rgba(16, 185, 129, .2);
      border-radius: 99px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 500;
      color: var(--green2);
    }

    .conn-pill .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse-green 2s infinite;
    }

    .conn-pill.offline {
      background: rgba(239, 68, 68, .08);
      border-color: rgba(239, 68, 68, .2);
      color: var(--red2);
    }

    .conn-pill.offline .dot {
      background: var(--red);
      box-shadow: 0 0 8px var(--red);
      animation: none;
    }

    @keyframes pulse-green {
      0%,
      100% {
        opacity: 1;
        box-shadow: 0 0 8px var(--green);
      }

      50% {
        opacity: .6;
        box-shadow: 0 0 3px var(--green);
      }
    }

    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 1;
    }

    .topbar {
      height: 64px;
      min-height: 64px;
      background: rgba(15, 24, 41, .85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 28px;
      gap: 16px;
    }

    .topbar-title {
      flex: 1;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -.3px;
    }

    .topbar-title span {
      color: var(--muted2);
      font-weight: 400;
      font-size: 13px;
      margin-left: 8px;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color .2s;
    }

    .avatar:hover {
      border-color: var(--pink);
    }

    .page-content {
      flex: 1;
      overflow-y: auto;
      padding: 28px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      cursor: default;
    }

    .stat-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .stat-icon svg {
      width: 22px;
      height: 22px;
    }

    .stat-body {
      flex: 1;
    }

    .stat-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -.5px;
      line-height: 1;
    }

    .stat-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-header h3 {
      font-size: 14px;
      font-weight: 600;
      flex: 1;
    }

    .card-body {
      padding: 20px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 18px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all .18s ease;
      font-family: inherit;
      white-space: nowrap;
    }

    .btn svg {
      width: 15px;
      height: 15px;
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--pink);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: #e0336f;
      box-shadow: 0 4px 16px rgba(244, 63, 135, .4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, .06);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      background: rgba(255, 255, 255, .1);
    }

    .btn-blue {
      background: rgba(59, 130, 246, .15);
      color: var(--blue2);
      border: 1px solid rgba(59, 130, 246, .3);
    }

    .btn-blue:hover:not(:disabled) {
      background: rgba(59, 130, 246, .25);
    }

    .btn-green {
      background: rgba(16, 185, 129, .15);
      color: var(--green2);
      border: 1px solid rgba(16, 185, 129, .3);
    }

    .btn-green:hover:not(:disabled) {
      background: rgba(16, 185, 129, .25);
    }

    .btn-red {
      background: rgba(239, 68, 68, .12);
      color: var(--red2);
      border: 1px solid rgba(239, 68, 68, .25);
    }

    .btn-red:hover:not(:disabled) {
      background: rgba(239, 68, 68, .22);
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 7px;
    }

    .btn-sm svg {
      width: 13px;
      height: 13px;
    }

    .btn-icon {
      width: 34px;
      height: 34px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
    }

    .btn-icon svg {
      width: 16px;
      height: 16px;
    }

    .input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--text);
      font-family: inherit;
      transition: border-color .18s;
      outline: none;
    }

    .input:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 3px rgba(244, 63, 135, .1);
    }

    .input::placeholder {
      color: var(--muted);
    }

    .input-code {
      font-family: 'Fira Code', monospace;
      font-size: 13px;
      line-height: 1.6;
      resize: vertical;
      min-height: 140px;
      tab-size: 2;
    }

    .label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted2);
      margin-bottom: 6px;
      display: block;
      letter-spacing: .3px;
    }

    .field {
      margin-bottom: 16px;
    }

    .table-wrap {
      overflow-x: auto;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead tr {
      background: rgba(255, 255, 255, .03);
      border-bottom: 1px solid var(--border);
    }

    th {
      padding: 11px 16px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: .6px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(30, 45, 69, .6);
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      color: var(--muted2);
      white-space: nowrap;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr {
      transition: background .15s;
    }

    tbody tr:hover {
      background: rgba(255, 255, 255, .025);
    }

    tbody tr.clickable {
      cursor: pointer;
    }

    tbody tr.clickable:hover {
      background: rgba(244, 63, 135, .06);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge-pink {
      background: rgba(244, 63, 135, .15);
      color: var(--pink2);
      border: 1px solid rgba(244, 63, 135, .25);
    }

    .badge-blue {
      background: rgba(59, 130, 246, .12);
      color: var(--blue2);
      border: 1px solid rgba(59, 130, 246, .25);
    }

    .badge-green {
      background: rgba(16, 185, 129, .12);
      color: var(--green2);
      border: 1px solid rgba(16, 185, 129, .25);
    }

    .badge-purple {
      background: rgba(139, 92, 246, .12);
      color: var(--purple2);
      border: 1px solid rgba(139, 92, 246, .25);
    }

    .badge-gold {
      background: rgba(245, 158, 11, .12);
      color: var(--gold2);
      border: 1px solid rgba(245, 158, 11, .25);
    }

    .badge-gray {
      background: rgba(100, 116, 139, .12);
      color: var(--muted2);
      border: 1px solid rgba(100, 116, 139, .2);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      margin-bottom: 8px;
      gap: 12px;
    }

    .toggle-row-info {
      flex: 1;
    }

    .toggle-row-info .t-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .toggle-row-info .t-desc {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .toggle-track {
      position: absolute;
      inset: 0;
      background: var(--border2);
      border-radius: 99px;
      cursor: pointer;
      transition: background .2s;
    }

    .toggle input:checked+.toggle-track {
      background: var(--pink);
    }

    .toggle input:checked+.toggle-track.gold {
      background: var(--gold);
    }

    .toggle-thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      background: #fff;
      border-radius: 50%;
      transition: transform .2s;
      pointer-events: none;
    }

    .toggle input:checked~.toggle-thumb {
      transform: translateX(20px);
    }

    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 52px 20px;
      gap: 12px;
      color: var(--muted);
    }

    .empty svg {
      width: 44px;
      height: 44px;
      stroke: var(--border2);
    }

    .empty p {
      font-size: 14px;
    }

    .empty small {
      font-size: 12px;
      color: var(--muted);
      opacity: .7;
    }

    .banner {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
    }

    .banner svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .banner-error {
      background: rgba(239, 68, 68, .1);
      border: 1px solid rgba(239, 68, 68, .25);
      color: var(--red2);
    }

    .banner-success {
      background: rgba(16, 185, 129, .1);
      border: 1px solid rgba(16, 185, 129, .25);
      color: var(--green2);
    }

    .banner-info {
      background: rgba(59, 130, 246, .1);
      border: 1px solid rgba(59, 130, 246, .2);
      color: var(--blue2);
    }

    .panel-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .5);
      backdrop-filter: blur(3px);
      z-index: 90;
    }

    .side-panel {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 380px;
      background: var(--card);
      border-left: 1px solid var(--border2);
      z-index: 91;
      display: flex;
      flex-direction: column;
      box-shadow: -20px 0 60px rgba(0, 0, 0, .5);
    }

    .side-panel-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .side-panel-header h3 {
      flex: 1;
      font-size: 16px;
      font-weight: 700;
    }

    .side-panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
    }

    .side-panel-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 16, 0.8);
      backdrop-filter: blur(6px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-card {
      background: var(--card);
      border: 1px solid var(--border2);
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.7);
      z-index: 101;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      animation: modalFadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes modalFadeIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .modal-header h3 {
      font-size: 15px;
      font-weight: 700;
      flex: 1;
    }

    .modal-body {
      padding: 20px;
      max-height: 70vh;
      overflow-y: auto;
    }

    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      background: rgba(255, 255, 255, 0.01);
    }

    /* Wide variant of the modal used for the data-import flow. */
    .modal-card.wide {
      max-width: 880px;
    }

    /* Step header row used inside the import modal. */
    .import-step {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .import-step .step-num {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      color: white;
      flex-shrink: 0;
    }
    .import-step .step-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    .import-step .step-sub {
      font-size: 11px;
      color: var(--muted);
    }

    /* Column-mapping table inside the import modal. */
    .mapping-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .mapping-table th {
      text-align: left;
      font-weight: 600;
      color: var(--muted);
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .mapping-table td {
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .mapping-table tr:last-child td { border-bottom: none; }

                ),

                ),
                msg ? React.createElement('div', { className: 'mb-3' },

        )

      const login = async function () {

        if (ok) {
          onLogin({ username, password }, data.tables || []);

    // Engine documentation is kept with the embedded interface so it ships with the daemon.
    const ENGINE_DOCS = [
      { id: 'first-steps', label: 'Getting started', eyebrow: 'USER GUIDE / 01', title: 'Your first steps', intro: 'FlamingoDB stores data in tables and lets you explore it with SQL or the AI assistant. This guide walks through the dashboard from sign-in to your first query.', sections: [
        { title: 'Start and sign in', items: [['Windows', 'Launch FlamingoDB from the desktop or Start menu. It starts the server and opens your browser. Use the Stop FlamingoDB shortcut to shut it down.'], ['Browser', 'Open http://localhost:8080 if the page does not open. Sign in with your database username and password. A fresh default installation starts with admin / admin; change the password in My Profile.'], ['Navigation', 'The left sidebar opens SQL Console, Table Browser, AI Assistant, Users, Settings, My Profile, and this documentation. Available actions depend on your account permissions.']] },
        { title: 'Create and query a table', text: 'Open SQL Console, enter the statements below and run them. CREATE defines the table and its columns; INSERT adds a row; SELECT reads it back. Run statements individually when learning, and inspect the result or error for each statement.', code: "CREATE TABLE stars (id INT, name VARCHAR, magnitude FLOAT);\nINSERT INTO stars VALUES (1, 'Sirius', -1.46);\nSELECT * FROM stars LIMIT 10;" },
        { title: 'Explore data', text: 'Open Table Browser and select a table to see its schema and first rows. Import Data accepts CSV, TSV, or flat JSON objects and lets you create a table or append to an existing one. Review the detected types, destination names, and preview before importing.' },
        { note: 'The browser interface requires a running server. Your database data is stored by the server; AI chat history is saved in the current browser, not shared between devices.' }
      ] },
      { id: 'console-guide', label: 'SQL & table browser', eyebrow: 'USER GUIDE / 02', title: 'Explore and query data', intro: 'Use the SQL Console for queries and the Table Browser for schemas, previews, and imports.', sections: [
        { title: 'SQL Console', text: 'Type SQL into the editor and select Run Query or press Ctrl+Enter. The results area shows rows, messages, and errors. Query History saves the latest 30 statements and their results in this browser for the signed-in username; select an entry to restore it without executing it again. The clear button removes saved history. CREATE TABLE defines columns; INSERT adds data; SELECT reads; UPDATE changes existing rows; DELETE removes rows. WHERE narrows which rows are affected.' },
        { title: 'Limit and paginate results', text: 'LIMIT caps the number of returned rows. OFFSET skips rows first. Use ORDER BY for a predictable order when moving between pages. LIMIT 0 returns no rows; an offset beyond the result returns an empty set.', code: 'SELECT * FROM stars ORDER BY id LIMIT 10;\nSELECT * FROM stars ORDER BY id LIMIT 10 OFFSET 10;' },
        { title: 'Import a dataset', items: [['Choose a file', 'Select Import Data in Table Browser. CSV uses the first row as headers; JSON accepts flat objects. The import limit is 10,000 rows per table. SQLite files can be opened locally in the browser (the SQLite reader requires an internet connection); import one table at a time. MySQL imports require an administrator, a reachable MySQL server, and a read-only source account. TLS is enabled by default. NULL and binary values are not supported.'], ['Map columns', 'Choose Create new table or Append to existing. Check names, choose INT, FLOAT, or VARCHAR for new columns, and skip any unwanted columns.'], ['Review', 'Check the preview, continue, and select Import. Empty or invalid numeric values are rejected. If a write fails, some earlier rows may already have been inserted.']] },
        { note: 'The importer creates basic numeric and text columns; latitude and longitude can be imported as numeric fields. Unit-aware values and native spatial types are not created by the import wizard.' }
      ] },
      { id: 'users-guide', label: 'Users & permissions', eyebrow: 'USER GUIDE / 03', title: 'Users and permissions', intro: 'Users authenticate to the database. Policies control which categories of operations a non-admin account can perform.', sections: [
        { title: 'Understand permissions', items: [['SELECT', 'Read table data.'], ['INSERT', 'Add rows to tables.'], ['UPDATE / DELETE', 'Change or remove existing rows.'], ['CREATE / DROP', 'Create or delete tables and other schema objects.'], ['Administrator', 'Administrators bypass operation policy checks. Assign this role only to users who need administrative access.']] },
        { title: 'Add a user', text: 'Sign in as an administrator, open Users, and choose Add User. Enter a username and password. Choose Administrator for full administrative access, or select a named policy for a non-admin user. Save the user and provide the credentials to them securely.' },
        { title: 'Change access', text: 'In Users, select an existing user. Choose a named policy or Custom, adjust the available permission switches when using Custom, and save. An administrator can also delete users from this page. Verify access by signing in as the affected user.' },
        { title: 'Create a reusable policy', text: 'Open Settings → System Policies and select New Policy. Name it, turn on the required SELECT, INSERT, UPDATE, DELETE, CREATE, and DROP switches, and create it. Return to Users to assign it. For example, enable only SELECT for a read-only account.' },
        { note: 'Named policy selection in the user form copies the chosen permissions to the user. Review and reassign users when changing policy definitions; do not assume an existing user automatically receives later changes.' }
      ] },
      { id: 'models-guide', label: 'AI models & chat', eyebrow: 'USER GUIDE / 04', title: 'Configure the AI assistant', intro: 'An administrator can configure a model and the policy used by its database tools. The assistant can then answer questions and work with the database through MCP.', sections: [
        { title: 'Add a model', items: [['1 · Open Settings', 'Choose AI Models, then Add Model.'], ['2 · Provider and model', 'Enter a display name, select a provider and model, or supply a custom model name. Add an optional description and thinking level where supported.'], ['3 · Access and credentials', 'Select a System Policy and enter the provider API key, then save. The provider must be reachable and the key must have access to the selected model.'], ['4 · Start a chat', 'Open AI Assistant, select the model, and ask a question. Try asking for a table summary or a chart of a numeric column.']] },
        { title: 'Model policies', text: 'The selected System Policy is passed to the MCP server for the model’s database tools. Choose a named read-only policy for a model that should inspect data without changing it. The None option is labelled Unrestricted / Admin and does not impose a named model policy. The signed-in user’s permissions and model policy are separate configuration concepts.' },
        { title: 'Chat history', text: 'New Chat creates another conversation for the selected model. Select a conversation from the side panel to resume its context. Histories are saved in this browser’s local storage; clearing browser data or changing browsers can remove access to them. Wait for a response before switching chats or models.' },
        { title: 'MCP and visualizations', text: 'MCP exposes tools for listing and describing tables, executing queries, generating chart specifications, calculating vector add, subtract, dot, cross, and norm operations, and calculating planar or approximate geographic distance. Geographic distance accepts latitude and longitude in degrees and returns kilometers; planar distance uses coordinate units. For a chart, ask the assistant to visualize a dataset. Charts need the chart library to load in the browser. Review generated queries and results.' },
        { note: 'AI responses depend on the configured provider and model. If configuration fails, check the provider, model identifier, API key, network access, and chosen policy.' }
      ] },
      { id: 'profile-guide', label: 'My profile & settings', eyebrow: 'USER GUIDE / 05', title: 'Manage your account', intro: 'My Profile shows your account and permissions and lets you change your password. Settings holds administrative policies and model configurations.', sections: [
        { title: 'My Profile', text: 'Open My Profile from the sidebar or your avatar. Review your username, administrator status, assigned policy, and permission switches. Use Update Password to enter and confirm a new password; the interface updates the credentials used by your current session.' },
        { title: 'Policy overrides', text: 'My Profile displays permission switches and a Save Policy Overrides action. Policy updates use the user policy endpoint, which requires administrator access. Administrators bypass operation policy checks even when individual switches appear off; non-admin users cannot grant themselves permissions through this endpoint.' },
        { title: 'Settings', items: [['System Policies', 'Administrators can create and delete named permission sets for assignment to users and AI models.'], ['AI Models', 'Administrators can add, edit, and delete provider configurations, API keys, model identifiers, thinking levels, and model policies.'], ['Connection', 'Disconnect from the sidebar to remove the current browser session credentials and return to sign-in.']] },
        { note: 'User, policy, and model configuration is stored by the server in its data directory. Chat conversations are stored separately in the browser.' }
      ] },
      { id: 'overview', label: 'Architecture overview', eyebrow: '01 / START HERE', title: 'Inside the engine', intro: 'Follow a request from the client to durable pages on disk. FlamingoDB combines a SQL execution pipeline with a page-oriented storage engine and a network server.', sections: [
        { title: 'The request lifecycle', text: 'A client sends SQL to the server or calls the embedded Go engine. The lexer produces tokens, the parser builds an abstract syntax tree, the planner constructs a tree of operators, and the optimizer applies rewrite rules. The executor evaluates that plan through the table manager, which coordinates the catalog, heap tables, indexes, transactions, and pages.' },
        { flow: ['SQL request', 'Lexer + parser', 'Planner', 'Optimizer', 'Executor', 'Storage + WAL'] },
        { title: 'Where to look', items: [['Entry points', 'cmd/flamingodbd starts the network daemon; engine.go exposes the embedded Go API.'], ['Query engine', 'internal/parser, internal/planner, internal/optimizer, and internal/executor implement the SQL pipeline.'], ['Persistence', 'internal/storage, internal/index/btree, internal/transaction, and internal/wal manage data on disk.'], ['Interfaces', 'internal/network serves HTTP, TCP, MCP, and this embedded web interface.']] },
        { note: 'This guide describes the implementation in this source tree. SQL coverage and operational guarantees are defined by the code, not by a claim of full SQL compatibility.' }
      ] },
      { id: 'query', label: 'Query processing', eyebrow: '02 / QUERY ENGINE', title: 'From SQL to results', intro: 'The engine processes a statement in distinct stages, keeping syntax, plan construction, optimization, and execution separate.', sections: [
        { title: 'Parse and plan', text: 'The lexer identifies keywords, identifiers, literals, and operators. A Pratt parser handles expression precedence and produces AST statements. The planner translates those statements into plan nodes such as Scan, Filter, Project, Insert, Join, Aggregate, Sort, and LimitOffset.' },
        { title: 'Optimize and execute', text: 'The optimizer recursively visits supported nodes and applies rules including filter pushdown, projection merging, wildcard projection removal, and index scan selection for eligible predicates. The executor runs the resulting tree and returns rows, affected-row counts, messages, or per-statement errors.' },
        { title: 'A minimal example', code: "CREATE TABLE stars (id INT, name VARCHAR, magnitude FLOAT);\nINSERT INTO stars VALUES (1, 'Sirius', -1.46);\nSELECT name, magnitude FROM stars WHERE magnitude < 0;" },
        { title: 'Query behavior', text: 'ProcessQuery parses a SQL string, then plans and executes its statements sequentially. Parse errors stop the request; individual planning or execution errors are reported in the results. Inspect each result for an error even when the HTTP response itself succeeds.' },
        { note: 'The parser implements a subset of SQL. Check internal/parser and the integration tests for the precise syntax supported by your version.' }
      ] },
      { id: 'storage', label: 'Storage & records', eyebrow: '03 / PERSISTENCE', title: 'How data is stored', intro: 'A table is represented by catalog metadata and a linked set of heap pages. The storage stack moves typed records between memory and a database file.', sections: [
        { title: 'Layers on disk', items: [['Disk manager', 'Reads and writes fixed-size pages in the database file and provides synchronization.'], ['Pager', 'Caches pages, allocates new pages, and flushes modified pages to disk. The default configured page size is 8 KiB.'], ['Catalog', 'Stores table schemas and metadata, including index metadata; the catalog is rooted at page 0.'], ['Heap tables', 'Store serialized records across linked pages. The table manager coordinates schema lookup, reads, writes, and index maintenance.']] },
        { title: 'Records and encoding', text: 'A schema defines ordered columns and their type IDs. Records hold typed values and serialize according to that schema. Integers are stored as int32, floats as float64, and variable-length data includes length information. Binary encoding helpers use little-endian representations.' },
        { title: 'Files', text: 'The daemon opens <data directory>/<database name>.db and the transaction manager uses an associated WAL file. User, policy, and model configuration is stored separately in the data directory.' },
        { note: 'Records must fit the engine’s page format. Storage and index behavior should be evaluated against the current implementation before relying on it for production workloads.' }
      ] },
      { id: 'indexes', label: 'Indexes', eyebrow: '04 / ACCESS PATHS', title: 'Finding rows faster', intro: 'The page-backed B+ tree provides an alternative access path for supported indexed values.', sections: [
        { title: 'Structure', text: 'B+ tree nodes live in pages. The implementation supports integer, float, and varchar keys, node splits, point lookups, and range scans. Index metadata is associated with the table in the catalog, and the table manager maintains indexes as records change.' },
        { title: 'Selection', text: 'The optimizer can replace a table scan under a filter with an index scan when it recognizes a compatible indexed comparison. It retains the filter to evaluate the predicate against the returned rows. Index selection is rule-based rather than a cost-based optimizer.' },
        { title: 'Working with indexes', code: 'CREATE INDEX idx_stars_name ON stars (name);\nSHOW INDEXES FROM stars;\nDROP INDEX idx_stars_name ON stars;' },
        { note: 'An index is useful only when a supported predicate and data type match the optimizer’s rules. Verify plans and behavior against the source for complex expressions.' }
      ] },
      { id: 'transactions', label: 'Transactions & recovery', eyebrow: '05 / DURABILITY', title: 'Transactions and the WAL', intro: 'Transactions maintain private dirty pages and use a write-ahead log to support commit, rollback, and recovery.', sections: [
        { title: 'Transaction lifecycle', items: [['Begin', 'The manager acquires a database-level transaction lock, assigns an ID, and records and syncs BEGIN.'], ['Write', 'Modified page images are kept in the transaction’s private workspace and appended to the WAL as updates.'], ['Commit', 'COMMIT is appended and the WAL is synced before dirty pages are written and flushed to the database file.'], ['Rollback', 'ABORT is recorded and synced; private dirty pages are discarded and the lock is released.']] },
        { title: 'Recovery', text: 'At startup the transaction manager scans the WAL and replays updates belonging to committed transactions. WAL records include checksums. This is a page-image redo mechanism; inspect internal/transaction and internal/wal for the exact recovery and error-handling behavior.' },
        { title: 'Concurrency', text: 'The transaction manager uses a global database-level lock for transaction isolation. Long-running transactions can therefore hold up other work. Operations with no supplied transaction generally use an automatic transaction in the table manager.' },
        { note: 'The web import validates rows before writing, but inserts are performed individually. An insertion error can leave a created table and a partial set of rows; the response reports how many were inserted.' }
      ] },
      { id: 'types', label: 'Types & functions', eyebrow: '06 / DATA MODEL', title: 'Types for scientific data', intro: 'Alongside basic relational values, the engine defines scientific and geospatial types and a registry of functions.', sections: [
        { title: 'Column types', items: [['INT / INTEGER', 'Signed 32-bit integer.'], ['FLOAT / DOUBLE / REAL', 'Double-precision floating-point value.'], ['VARCHAR / STRING / TEXT', 'Variable-length text.'], ['COMPLEX, VECTOR, MATRIX, TENSOR', 'Scientific values represented by dedicated internal types.'], ['POINT, POLYGON', 'Two-dimensional geometric values.']] },
        { title: 'Functions', text: 'The functions package registers mathematical and scientific operations including trigonometric functions, EXP, LOG, SQRT, ABS, POW, DOT, CROSS, and NORM. Geospatial support includes point and polygon operations. Function argument and expression support is enforced by the executor.' },
        { title: 'Scientific example', code: 'CREATE TABLE research_runs (run_id INT, embedding VECTOR);\nINSERT INTO research_runs VALUES (1, [1.0, 2.0, 3.0]);\nSELECT run_id, NORM(embedding) FROM research_runs;' },
        { note: 'The import wizard creates INT, FLOAT, and VARCHAR columns. JSON imports accept flat objects; nested objects and arrays are not imported as scientific values.' }
      ] },
      { id: 'interfaces', label: 'HTTP, TCP & MCP', eyebrow: '07 / INTERFACES', title: 'Connect to FlamingoDB', intro: 'The daemon exposes the embedded web dashboard and programmatic interfaces over HTTP and TCP. It can also run an MCP server over standard input and output.', sections: [
        { title: 'HTTP endpoints', items: [['POST /query', 'Execute SQL with a JSON body containing query and, optionally, tx_id.'], ['POST /tx/begin', 'Start a transaction and receive a transaction ID.'], ['POST /tx/commit · /tx/rollback', 'Complete a transaction with a JSON body containing tx_id.'], ['GET /api/tables · /api/describe?table=…', 'List tables or inspect a table schema.'], ['POST /api/import', 'Create or append to a table from an already-parsed mapping and rows.'], ['/api/users · /api/policies · /api/models', 'Manage users, named policies, and AI model configuration through their respective endpoints.']] },
        { title: 'HTTP query example', code: "curl -u admin:password -X POST http://localhost:8080/query \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"query\":\"SELECT * FROM stars;\"}'" },
        { title: 'TCP and MCP', text: 'The TCP server exchanges JSON requests and responses and supports authentication, queries, transactions, and metadata commands. Start the daemon with -mcp to use its stdio MCP mode; -policy selects a policy for that mode.' },
        { title: 'Authentication and policies', text: 'HTTP uses Basic authentication. The server stores users and policies in its data directory; administrators bypass the operation policy checks. Non-admin operations are subject to the server’s policy checks. Use transport protection and deployment controls appropriate to your environment.' }
      ] },
      { id: 'operations', label: 'Running & importing', eyebrow: '08 / OPERATIONS', title: 'Run and work with data', intro: 'Start the daemon, connect to the dashboard, and use the table browser to inspect or import data.', sections: [
        { title: 'Start the server', code: 'go run ./cmd/flamingodbd -dir ./data -db flamingo -http :8080 -tcp :4080 -user admin -pass your-password' },
        { title: 'Configuration', text: 'The daemon accepts -dir, -db, -http, -tcp, -user, -pass, -mcp, and -policy flags. Open http://localhost:8080/ to use the dashboard. The configured credentials seed the admin account when the user store is created; an existing stored admin is not overwritten on startup.' },
        { title: 'Import a file', items: [['1 · Choose data', 'Open Table Browser → Import Data and select CSV, TSV, or JSON. CSV uses its first row as column names; JSON accepts flat objects.'], ['2 · Map columns', 'Choose a new table or an existing destination, review names and inferred types, and skip columns if needed.'], ['3 · Review and import', 'Inspect the preview and start the import. The limit is 10,000 rows per import. Numeric values must match their destination type.']] },
        { title: 'Source and verification', text: 'The Go source is organized by subsystem under internal/. Run go test ./... from the repository root to exercise the available package tests. Check the daemon logs and returned per-statement errors when diagnosing failures.' }
      ] }
    ];

    // App Shell

    const PAGES = [
      { id: 'console', label: 'SQL Console', icon: 'terminal' },

      { id: 'docs', label: 'Documentation', icon: 'book-open' },

      { id: 'settings', label: 'Settings', icon: 'settings' },
      { id: 'profile', label: 'My Profile', icon: 'user' },
    ];

    function App() {
      const [creds, setCreds] = useState(null);
      const [page, setPage] = useState('console');
      const [publicDocs, setPublicDocs] = useState(false);
      const [stats, setStats] = useState({ tables: 0, queries: 0, users: 0 });
      const [online, setOnline] = useState(true);

      useEffect(function () {
        try {
          const saved = sessionStorage.getItem('flamingo_creds');
          if (saved) setCreds(JSON.parse(saved));
        } catch (e) { }
      }, []);

      const handleLogin = function (c, tables) {
        setCreds(c);
        setStats(function (s) { return Object.assign({}, s, { tables: tables.length }); });
        sessionStorage.setItem('flamingo_creds', JSON.stringify(c));
        apiFetch('/api/users', {}, c).then(function (r) { if (r.ok && r.data.users) setStats(function (s) { return Object.assign({}, s, { users: r.data.users.length }); }); });
      };

      const logout = function () {
        setCreds(null);
        sessionStorage.removeItem('flamingo_creds');
      };

      useEffect(function () {
        if (!creds) return;
        const check = function () {
          apiFetch('/api/tables', {}, creds).then(function (r) { setOnline(r.ok); }).catch(function () { setOnline(false); });
        };
        check();
        const iv = setInterval(check, 30000);
        return function () { clearInterval(iv); };
      }, [creds]);

      useEffect(function () {
        if (!creds) return;
        apiFetch('/api/tables', {}, creds).then(function (r) { if (r.ok && r.data.tables) setStats(function (s) { return Object.assign({}, s, { tables: r.data.tables.length }); }); });
        apiFetch('/api/users', {}, creds).then(function (r) { if (r.ok && r.data.users) setStats(function (s) { return Object.assign({}, s, { users: r.data.users.length }); }); });

            ),
            React.createElement('main', { className: 'page-content' }, React.createElement(EngineDocsPage))
          )
        );
        return React.createElement(LoginPage, { onLogin: handleLogin, onOpenDocs: function() { setPublicDocs(true); } });
      }

      return React.createElement('div', { className: 'app-shell' },
        React.createElement('nav', { className: 'sidebar' },
          React.createElement('div', { className: 'sidebar-logo' },
            React.createElement('div', { className: 'logo-icon' }, React.createElement(Icon, { name: 'database-zap', size: 20 })),
            React.createElement('span', { className: 'logo-text' }, 'FlamingoDB')
          ),
          React.createElement('div', { className: 'sidebar-nav' },
            React.createElement('div', { className: 'nav-label' }, 'Navigation'),
            PAGES.map(function (p) {
              return React.createElement(motion.div, {
                key: p.id,
                className: 'nav-item' + (page === p.id ? ' active' : ''),
                onClick: function () { setPage(p.id); },
                whileHover: { x: 2 },
                transition: { type: 'spring', stiffness: 400, damping: 30 }
              },
                React.createElement(Icon, { name: p.icon, size: 17 }),
                p.label,
                page === p.id ? React.createElement('span', { className: 'nav-dot' }) : null
              );
            })
          ),
          React.createElement('div', { className: 'sidebar-footer' },
            React.createElement('div', { className: 'conn-pill' + (online ? '' : ' offline'), style: { marginBottom: 8 } },
              React.createElement('span', { className: 'dot' }),
              React.createElement('span', { style: { flex: 1 } }, online ? 'Connected' : 'Offline')
            ),
            React.createElement('div', {
              className: 'nav-item',
              onClick: logout,
              style: { margin: '4px 0 0 0' }
            },
              React.createElement(Icon, { name: 'log-out', size: 16 }),
              'Disconnect'
            ),
            React.createElement('div', { style: { marginTop: 12, fontSize: 11, color: 'var(--muted)', textAlign: 'center' } },
              'Signed in as ',
              React.createElement('span', { style: { color: 'var(--text)', fontWeight: 600 } }, creds.username)
            )

        ),
        React.createElement('div', { className: 'main-area' },
          React.createElement('header', { className: 'topbar' },
